<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1270 415" role="img" aria-label="Animated schematic of the 1x4 cascaded-MZI demultiplexer: light pulses of the four channels are routed by MZI 1 and MZI 2A / 2B to their outputs." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>1×4 cascaded-MZI CWDM demultiplexer</title>
<style>
  .bg{fill:#14120F;}
  .tick{stroke:#332C23;stroke-width:1;}
  .wg{fill:none;stroke:#E8843C;stroke-width:1.6;stroke-linecap:round;filter:drop-shadow(0 0 4px #E8843C);}
  .lbl{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;fill:#A79C8C;}
  .l-s{font-size:8.8px;}
  .lbl-hot{fill:#E8843C;}
  .wlv{fill:#A79C8C;}
  .ch1{fill:#FF5A4E;} .ch2{fill:#3FB6F2;} .ch3{fill:#45D06E;} .ch4{fill:#FFC23D;}
  .flow{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-dasharray:16 2000;stroke-dashoffset:2016;}
  .f1{stroke:#FF5A4E;filter:drop-shadow(0 0 5px #FF5A4E);}
  .f2{stroke:#3FB6F2;filter:drop-shadow(0 0 5px #3FB6F2);}
  .f3{stroke:#45D06E;filter:drop-shadow(0 0 5px #45D06E);}
  .f4{stroke:#FFC23D;filter:drop-shadow(0 0 5px #FFC23D);}
  @media (prefers-reduced-motion:no-preference){
    .wg{stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 2.4s ease forwards .3s;}
    @keyframes draw{to{stroke-dashoffset:0;}}
    .flow{animation:flow 2.8s linear infinite;}
    .o1{animation-delay:2.2s;} .o2{animation-delay:2.9s;} .o3{animation-delay:3.6s;} .o4{animation-delay:4.3s;}
    @keyframes flow{from{stroke-dashoffset:2016;}to{stroke-dashoffset:0;}}
  }
</style>
